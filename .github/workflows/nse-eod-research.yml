name: FnO Tattva NSE EOD OI research
on:
  push:
    branches: [main, nse-eod-technical-confluence]
    paths:
      - 'tools/nse_eod/**'
      - 'tests/test_nse_eod_research.py'
      - '.github/workflows/nse-eod-research.yml'
  workflow_dispatch:
    inputs:
      market_date:
        description: 'Optional YYYY-MM-DD archive date for a reproducible test'
        required: false
        type: string
  schedule:
    # 19:15 Asia/Kolkata Mon-Fri (UTC does not observe daylight saving)
    - cron: '45 13 * * 1-5'
permissions:
  contents: read
concurrency:
  group: nse-eod-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate analysis engine offline
        run: python -m unittest discover -s tests -p 'test_nse_eod_research.py' -v
      - name: Restore prior research watch state
        uses: actions/cache/restore@v4
        with:
          path: nse_eod_state.json
          key: nse-eod-state-${{ github.run_id }}
          restore-keys: |
            nse-eod-state-
      - name: Fetch, validate and analyze NSE EOD archives
        env:
          MANUAL_DATE: ${{ inputs.market_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MANUAL_DATE" ]]; then
            python tools/nse_eod/runner.py --asof "$MANUAL_DATE"
          elif [[ "${{ github.ref_name }}" == "nse-eod-technical-confluence" && "${{ github.event_name }}" == "push" ]]; then
            python tools/nse_eod/runner.py --asof 2026-11-03
          else
            python tools/nse_eod/runner.py
          fi
      - name: Preserve research report for authorized retrieval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-eod-research-report
          path: |
            out/report.md
            out/report.json
          retention-days: 14
          if-no-files-found: warn
      - name: Persist candidate tracking between runs
        if: ${{ hashFiles('nse_eod_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: nse_eod_state.json
          key: nse-eod-state-${{ github.run_id }}
