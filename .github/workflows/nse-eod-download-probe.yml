name: NSE archive read-only download probe
on:
  push:
    branches: [nse-eod-download-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive retrieval and ZIP/CSV extraction
        run: python3 tools/nse_eod_probe.py
      - name: Save test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-download-probe-results
          path: probe_results.json
          retention-days: 2
